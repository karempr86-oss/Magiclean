<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magic Clean | ماجيك كلين 15 سنة خبرة</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070714;
      --card: #101025;
      --main: #8B5CF6;
      --main-light: #A78BFA;
      --accent: #FACC15;
      --text: #E5E7EB;
      --whatsapp: #25D366;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; scroll-behavior: smooth; }
    body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); }
    body::before { content: ''; position: fixed; width: 100%; height: 100%; background: radial-gradient(circle at 30% 20%, rgba(139, 92, 246, 0.2) 0%, transparent 50%); z-index: -1; }
.container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.7); } 50% { box-shadow: 0 0 0 15px rgba(37, 211, 102, 0); } }
    @keyframes glow { 0%,100% { text-shadow: 0 0 10px rgba(139,92,246,0.5); } 50% { text-shadow: 0 0 25px rgba(139,92,246,0.9); } }
.cursor { display: inline-block; width: 3px; background: var(--accent); animation: blink 1s infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    header { padding: 20px 0; position: fixed; width: 100%; top: 0; background: rgba(7,7,20,0.8); backdrop-filter: blur(15px); z-index: 100; border-bottom: 1px solid rgba(139,92,246,0.1); }
.nav { display: flex; justify-content: space-between; align-items: center; }

.logo-text {
      font-size: 32px;
      font-weight: 900;
      background: linear-gradient(90deg, #A78BFA, #FACC15);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: glow 3s ease-in-out infinite;
      cursor: pointer;
      letter-spacing: 1px;
    }

.nav-buttons { display: flex; gap: 12px; align-items: center; }
.btn { background: linear-gradient(90deg, #7C3AED, #8B5CF6); color: white; padding: 10px 22px; border-radius: 50px; text-decoration: none; font-weight: 700; border: none; cursor: pointer; transition: 0.3s; display: inline-block; font-size: 15px; }
.btn:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(139,92,246,0.5); }
.btn-outline { background: transparent; border: 2px solid var(--main); }
.btn-outline:hover { background: var(--main); }

.floating-btns {
      position: fixed;
      bottom: 25px;
      left: 25px;
      z-index: 999;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
.float-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      text-decoration: none;
      color: white;
      transition: 0.3s;
      animation: pulse 2s infinite;
    }
.float-btn:hover { transform: scale(1.1); }
.whatsapp-btn { background: var(--whatsapp); }
.call-btn { background: var(--main); animation-delay: 0.5s; }

    /* HERO - صورة واحدة ثابتة */
.hero {
      padding: 200px 20px 120px;
      text-align: center;
      position: relative;
      overflow: hidden;
      min-height: 700px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: url('https://karempr86-oss.github.io/Magiclean/hero.jpg') center/cover no-repeat;
    }
.hero::after {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: linear-gradient(180deg, rgba(7,7,20,0.85) 0%, rgba(7,7,20,0.6) 50%, rgba(7,7,20,0.85) 100%);
      z-index: 1;
    }
.hero-content { position: relative; z-index: 2; }
.hero h1 { font-size: 65px; font-weight: 900; background: linear-gradient(90deg, #A78BFA, #FACC15); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.hero.subtitle { font-size: 24px; margin: 20px 0 40px; color: #E5E7EB; min-height: 35px; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
.hero p { text-shadow: 0 2px 10px rgba(0,0,0,0.8); }

.stats { padding: 80px 20px; background: var(--card); }
.stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 30px; text-align: center; }
.stat h3 { font-size: 50px; color: var(--main-light); font-weight: 900; }

.services { padding: 100px 20px; }
.services h2 { text-align: center; font-size: 44px; margin-bottom: 60px; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; }
.card { background: var(--card); padding: 35px; border-radius: 20px; border: 1px solid rgba(139,92,246,0.2); transition: 0.4s; cursor: pointer; }
.card:hover { transform: translateY(-12px); border-color: var(--main); box-shadow: 0 15px 50px rgba(139,92,246,0.3); }

.about { padding: 100px 20px; background: var(--card); }
.about h2 { text-align: center; font-size: 44px; margin-bottom: 40px; }
.about-content { display: grid; grid-template-columns: 1fr 1fr; gap: 50px; align-items: center; }
.about-text p { font-size: 18px; line-height: 1.9; margin-bottom: 20px; color: #9CA3AF; }
.about-img { width: 100%; border-radius: 20px; box-shadow: 0 0 40px rgba(139,92,246,0.3); }

.testimonials { padding: 100px 20px; }
.testimonials h2 { text-align: center; font-size: 44px; margin-bottom: 60px; }
.testi-slider { display: flex; gap: 30px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 20px; }
.testi-card { min-width: 350px; background: var(--card); padding: 30px; border-radius: 20px; border: 1px solid rgba(139,92,246,0.2); scroll-snap-align: start; }
.stars { color: var(--accent); font-size: 20px; margin-bottom: 15px; }

.map { padding: 100px 20px; background: var(--card); }
.map h2 { text-align: center; font-size: 44px; margin-bottom: 40px; }
.map iframe { width: 100%; height: 450px; border: none; border-radius: 20px; box-shadow: 0 0 40px rgba(139,92,246,0.2); }

.service-detail { display: none; padding: 150px 20px 100px; }
.service-detail.active { display: block; animation: fadeUp 0.5s; }
.back-btn { margin-bottom: 30px; background: transparent; border: 1px solid var(--main); }
.service-detail h2 { font-size: 40px; color: var(--main-light); margin-bottom: 20px; }
.service-detail ul { list-style: none; margin: 20px 0; }
.service-detail ul li { background: var(--card); padding: 15px; margin: 10px 0; border-radius: 10px; border-right: 3px solid var(--main); }

    footer { padding: 60px 20px; border-top: 1px solid rgba(139,92,246,0.2); text-align: center; }

    @media(max-width: 768px) {
  .grid,.stats-grid,.about-content { grid-template-columns: 1fr; }
  .hero h1 { font-size: 42px; }
  .logo-text { font-size: 24px; }
  .nav-buttons { gap: 8px; }
  .btn { padding: 8px 16px; font-size: 13px; }
  .testi-card { min-width: 300px; }
  .floating-btns { bottom: 20px; left: 20px; }
  .float-btn { width: 55px; height: 55px; font-size: 26px; }
  .hero { min-height: 600px; padding: 160px 20px 80px; }
    }
  </style>
</head>
<body>

  <div class="floating-btns">
    <a href="https://wa.me/201032990659?text=مرحبا ماجيك كلين عايز استفسر عن الخدمات" target="_blank" class="float-btn whatsapp-btn">💬</a>
    <a href="tel:01032990659" class="float-btn call-btn">📞</a>
  </div>

  <header>
    <div class="container nav">
      <div class="logo-text" onclick="showHome()">
        MagicClean
      </div>
      <div class="nav-buttons">
        <a href="#about" class="btn btn-outline">من نحن</a>
        <a href="https://wa.me/201032990659" class="btn">اطلب الان</a>
      </div>
    </div>
  </header>

  <div id="home">
    <!-- HERO بصورة واحدة -->
    <section class="hero">
      <div class="container hero-content">
        <h1>Magic Clean</h1>
        <p class="subtitle"><span id="typing"></span><span class="cursor"></span></p>
        <p>15 سنة من التميز والاحترافية</p>
        <a href="#services" class="btn">شوف خدماتنا</a>
      </div>
    </section>

    <!-- باقي الاقسام زي ما هي -->
    <section class="stats">...</section>
    <section class="about" id="about">...</section>
    <section class="services" id="services">...</section>
    <section class="testimonials">...</section>
    <section class="map" id="map">...</section>
  </div>

  <!-- صفحات الخدمات زي ما هي -->
  
  <footer>...</footer>

  <script>
    // Typing Effect
    const text = "نظافة... تليق بك";
    let i = 0;
    function typing() {
      if (i < text.length) {
        document.getElementById("typing").innerHTML += text.charAt(i);
        i++;
        setTimeout(typing, 100);
      }
    }
    typing();

    function showService(service) {
      document.getElementById('home').style.display = 'none';
      document.querySelectorAll('.service-detail').forEach(el => el.classList.remove('active'));
      document.getElementById('service-' + service).classList.add('active');
      window.scrollTo(0,0);
    }
    function showHome() {
      document.getElementById('home').style.display = 'block';
      document.querySelectorAll('.service-detail').forEach(el => el.classList.remove('active'));
      window.scrollTo(0,0);
    }
  </script>

</body>
</html>
